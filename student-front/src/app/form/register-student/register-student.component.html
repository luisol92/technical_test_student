<mat-card appearance="outlined">
    <mat-card-header>
        <mat-card-title>Register Students</mat-card-title>
    </mat-card-header>
    <br>
    <mat-card-content>
        <form [formGroup]="form()" (submit)="save()">
            <mat-form-field>
                <mat-label>Full Name</mat-label>
                <input type="text" formControlName="name" matInput>
            </mat-form-field>
            <br>
            <mat-form-field>
                <mat-label>Birthdate</mat-label>
                <input type="date" formControlName="birthdate" matInput>
            </mat-form-field>
            <br>
            <mat-form-field>
                <mat-label>Father's Name</mat-label>
                <input formControlName="father" matInput>
            </mat-form-field>
            <br>
            <mat-form-field>
                <mat-label>Mother's Name</mat-label>
                <input type="text" formControlName="mother" matInput>
            </mat-form-field>
            <br>
            <mat-form-field>
                <mat-label>Grades</mat-label>
                <mat-select formControlName="grade_id">
                  <mat-option value="one">First option</mat-option>
                  <mat-option value="two">Second option</mat-option>
                </mat-select>
            </mat-form-field>
            <br>
            <mat-form-field>
                <mat-label>Section</mat-label>
                <input type="text" formControlName="section" matInput>
            </mat-form-field>
            <br>
            <button mat-fab extended type="submit">
                <mat-icon>save</mat-icon>
                Save
            </button>
        </form>        
    </mat-card-content>
</mat-card>
